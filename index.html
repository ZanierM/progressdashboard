<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 12 Progress Dashboard</title>
<meta name="robots" content="noindex">
<style>
:root{
  --green:#8a4f81; --green-d:#6f3f68; --green-soft:#f5edf4; --purple:#a06098; --slate:#424753;
  --bg:#eceeef; --panel:#fff; --line:#dcdfe3; --soft:#f3f4f6; --text:#2e323b; --muted:#666c78;
  --ex:#7a4273; --gd:#d8c2d4; --be:#e07b24; --be-soft:#fcebdc; --up:#7a4273; --down:#c4611a;
  --head:"Century Gothic","CenturyGothic","AppleGothic","Futura","Avenir Next",Arial,sans-serif;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;margin:0}
a{color:var(--ex)}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* header */
#top{background:var(--green);border-bottom:4px solid var(--slate);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
#top h1{font-size:19px;letter-spacing:.01em;white-space:nowrap}
#top h1 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
#top .sp{flex:1}
#top select{background:#fff;color:var(--text);border:0;border-radius:6px;padding:6px 8px;max-width:260px}
#top label{font-size:12.5px;opacity:.9}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--soft)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.g:hover{background:var(--green-d)}
#top .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
#top .btn:hover{background:rgba(255,255,255,.22)}
#top .btn.w{background:#fff;color:var(--green)}
#nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto;position:sticky;top:0;z-index:15}
#nav button{border:0;background:none;padding:12px 14px;cursor:pointer;font-family:var(--head);font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
#nav button.on{color:var(--green);border-bottom-color:var(--green)}
#nav .badge{background:var(--be);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px;font-family:var(--font)}
main{max-width:1320px;margin:0 auto;padding:18px}
.privacy{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 18px 24px}

/* building blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel>h2{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.panel>h2 .sp{flex:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--purple)}
.kpi .v{font-family:var(--head);font-size:30px;font-weight:700}
.kpi .k{color:var(--muted);font-size:13px;margin-top:2px}
.kpi .d{font-size:12.5px;margin-top:6px}
.up{color:var(--up);font-weight:700} .down{color:var(--down);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);padding:7px 8px;white-space:nowrap;cursor:default}
table.t th.s{cursor:pointer} table.t th.s:hover{color:var(--text)}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--green-soft)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;min-width:28px;text-align:center;font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 4px;margin:1px}
.c-EX{background:var(--ex);color:#fff} .c-GD{background:var(--gd);color:#3a2036} .c-BE{background:var(--be);color:#fff} .c-{background:var(--soft);color:var(--muted)}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--soft);min-width:120px}
.stack div{height:100%}
.stack .EX{background:var(--ex)} .stack .GD{background:var(--gd)} .stack .BE{background:var(--be)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.reason{display:inline-block;background:var(--be-soft);border:1px solid #f3c79e;color:#7a3a07;border-radius:4px;padding:1px 6px;font-size:12px;margin:1px 3px 1px 0}
.reason.dec{background:#fff4e0;border-color:#f0d49c;color:#6b4a05}
.reason.att{background:#eef0f3;border-color:#c7ccd4;color:#2e323b}
.att{font-weight:700;font-variant-numeric:tabular-nums}
.att.attlow{color:#fff;background:var(--be);border-radius:4px;padding:1px 5px}
.att.attmid{color:#9a4c0e}
.good{display:inline-block;background:#f3e8f1;border:1px solid #dcc4d8;color:#5a2f54;border-radius:4px;padding:1px 6px;font-size:12px;margin:1px 3px 1px 0}
.res{font-weight:700;font-size:12.5px}
.res.pos{color:var(--up)} .res.neg{color:var(--down)} .res.z{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 13px;cursor:pointer;font-weight:700}
.pills button.on{background:var(--green);border-color:var(--green);color:#fff}
.subjcell{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin:2px 4px 2px 0;min-width:150px;vertical-align:top;background:#fff}
.subjcell b{display:block;font-size:12px;margin-bottom:2px}
.subjcell.flag{border-color:#f3c79e;background:#fffaf5}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:50px 20px}
.empty h2{font-size:26px;margin-bottom:8px}
.empty p{max-width:640px;margin:8px auto;line-height:1.6;color:var(--muted)}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.choice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;width:250px;text-align:left;cursor:pointer;border-top:4px solid var(--green)}
.choice:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.choice h3{font-size:16px;margin-bottom:6px}
.choice p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;text-align:left}
.spark{vertical-align:middle}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar div{height:100%;background:var(--green)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal .box{background:#fff;overflow:hidden;border-radius:12px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{background:var(--green);color:#fff;padding:14px 18px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px}
.modal .mh h2{font-size:18px;flex:1}
.modal .mh .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.grid>*{min-width:0}
.field select,.field input,.field textarea{width:100%;min-width:0;border:1px solid #c9d0c8;border-radius:6px;padding:7px 9px;font-weight:400;background:#fff}
.maptable{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.maptable table td{padding:4px 8px}
.maptable input,.maptable select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%}
.preview{overflow:auto;max-height:180px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.preview table td,.preview table th{white-space:nowrap;padding:3px 7px;border-bottom:1px solid var(--line);text-align:left}
.steps{display:flex;gap:8px;margin-bottom:14px;font-size:13px}
.steps span{padding:4px 10px;border-radius:14px;background:var(--soft);color:var(--muted);font-weight:700}
.steps span.on{background:var(--green);color:#fff}
.ok{background:var(--green-soft);border:1px solid #dcc4d8;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.warn{background:var(--be-soft);border:1px solid #f3c79e;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:99;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:900px){
  .g4{grid-template-columns:1fr 1fr} .g2,.g3{grid-template-columns:1fr}
  main{padding:12px}
  #top{position:static;gap:6px 8px;padding:10px 12px}
  #top h1{width:100%}
  #top .sp,#top label{display:none}
  #top select{flex:1 1 100%;max-width:none}
  #top .btn{padding:6px 9px;font-size:12.5px}
  .scrollx{overflow-x:auto}
}
.printhead{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;font-size:11px}
  #top,#nav,.toolbar,.noprint,.privacy,#toast{display:none!important}
  main{max-width:none;padding:0}
  .panel{border:0;padding:0;margin-bottom:10px;break-inside:auto}
  .printhead{display:block;border-bottom:3px solid var(--green);margin-bottom:10px;padding-bottom:4px}
  .printhead h1{font-size:18px}
  .pagebreak{break-before:page}
  table.t td,table.t th{padding:3px 5px}
  .chip,.stack div,.c-EX,.c-GD,.c-BE,.reason{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header id="top">
  <h1>Year 12 Progress<small>Dashboard</small></h1>
  <div class="sp"></div>
  <label for="dropSel">Data drop</label>
  <select id="dropSel"></select>
  <button class="btn w" id="addBtn">+ Add data</button>
  <button class="btn" id="saveBtn" title="Download everything as one file to keep on OneDrive">Save workbook</button>
  <button class="btn" id="openBtn">Open workbook</button>
  <button class="btn" id="setBtn">Settings</button>
  <input type="file" id="openFile" accept=".json,.y12" class="hidden">
</header>
<nav id="nav" class="hidden">
  <button data-v="overview" class="on">Overview</button>
  <button data-v="concerns">Students of concern <span class="badge" id="nConcern">0</span></button>
  <button data-v="tutor">Tutor groups</button>
  <button data-v="subjects">Subjects</button>
  <button data-v="attendance" id="navAtt">Attendance</button>
  <button data-v="student">Student profile</button>
</nav>
<main id="view"></main>
<div class="privacy">Everything happens in this browser. Student data is not uploaded or sent anywhere. Use <b>Save workbook</b> to keep a copy on OneDrive, and close the tab when you've finished.</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// =====================================================================
//  SETTINGS YOU CAN CHANGE HERE (also editable in the Settings window)
// =====================================================================
const DEFAULT_SETTINGS = {
  school: 'Year 12',
  forms: { '12A': 'EOL', '12C': 'EMH', '12D': 'JZU / RH', '12L': 'HHN', '12P': 'GAI', '12R': 'MPT', '12W': 'NYE' },
  beMin: 2,        // flag when a student has this many BE grades (across all subjects and indicators)
  belowMin: 2,     // flag when this many subjects are 1+ grade below target
  farBelow: 2,     // flag any subject this many grades below target
  dropMin: 3,      // flag when this many indicator grades have fallen since the previous drop
  wagDropMin: 2,   // flag when the working-at grade has fallen in this many subjects
  attMin: 90,      // flag attendance below this %
  attDrop: 3,      // flag attendance that has fallen by this many percentage points since the previous upload
  remember: false, // keep data in this browser between visits
};

// =====================================================================
//  Helpers
// =====================================================================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pc = (a, b) => (b ? Math.round((100 * a) / b) : 0);
const avg = (a) => { a = a.filter((v) => v != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
const IND = ['atl', 'rtf', 'qow'];
const IND_NAME = { atl: 'Attitude to Learning', rtf: 'Response to Feedback', qow: 'Quality of Work' };
const IND_SHORT = { atl: 'ATL', rtf: 'RtF', qow: 'QoW' };
const chip = (v) => `<span class="chip c-${v || ''}">${v || '–'}</span>`;

// ---------- grades ----------
function indicator(v) {
  const s = String(v ?? '').trim().toUpperCase();
  if (!s) return '';
  if (/^EX|^EXC/.test(s)) return 'EX';
  if (/^GD|^GO/.test(s)) return 'GD';
  if (/^BE|^BEL/.test(s)) return 'BE';
  return '';
}
const IND_VAL = { EX: 3, GD: 2, BE: 1 };
const AL = { 'A*': 6, A: 5, B: 4, C: 3, D: 2, E: 1, U: 0 };
const BT = { 'D*': 4, D: 3, M: 2, P: 1, U: 0 };
function isBtecSubject(name, values) {
  if (/btec|cambridge tech|technical|extended cert|diploma|certificate|ctec/i.test(name)) return true;
  return values.some((v) => /^(M|P|MERIT|PASS|DIST)/i.test(String(v).trim()));
}
function gradeValue(v, btec) {
  let s = String(v ?? '').trim().toUpperCase().replace(/\s+/g, '');
  if (!s) return null;
  s = s.replace('DISTINCTION*', 'D*').replace('DIST*', 'D*').replace('DISTINCTION', 'D').replace('DIST', 'D').replace('MERIT', 'M').replace('PASS', 'P');
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  if (s.includes('/')) { const p = s.split('/').map((x) => gradeValue(x, btec)); return p.every((x) => x != null) ? avg(p) : null; }
  let mod = 0;
  if (/[+]$/.test(s)) { mod = 0.33; s = s.slice(0, -1); } else if (/-$/.test(s)) { mod = -0.33; s = s.slice(0, -1); }
  const map = btec ? BT : AL;
  if (s in map) return map[s] + mod;
  if (btec) { const toks = s.match(/D\*|D|M|P|U/g); if (toks && toks.join('') === s) return avg(toks.map((t) => BT[t])) + mod; }
  return null;
}

// =====================================================================
//  State
// =====================================================================
let WB = null;         // { version, settings, drops:[{id,name,records:[]}] }
let CUR = null;        // index of selected drop
let VIEW = 'overview';
let DIRTY = false;
let UI = { form: null, subject: null, student: null, sort: 'score', cForm: '' };

function newWorkbook() { return { version: 1, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), drops: [], att: [] }; }
// ---------- attendance ----------
// Students are matched by name + tutor group, whatever order the name is written in
function nkey(name, form) { return String(name || '').toLowerCase().replace(/[^a-z\s'-]/g, ' ').split(/[\s]+/).filter(Boolean).sort().join(' ') + '|' + String(form || '').toUpperCase(); }
function parsePct(v) { const s = String(v ?? '').replace(/%/g, '').trim(); if (!s) return null; const n = parseFloat(s); return isNaN(n) ? null : n; }
const attSnaps = () => (WB && WB.att) || [];
function attMap(i) { const a = attSnaps()[i]; const m = new Map(); if (a) for (const r of a.records) m.set(r.nk, r.pct); return m; }
function attInfo(nk) {
  const n = attSnaps().length; if (!n) return null;
  const now = attMap(n - 1).get(nk), before = n > 1 ? attMap(n - 2).get(nk) : undefined;
  if (now == null) return null;
  return { pct: now, prev: before ?? null, change: before != null ? Math.round((now - before) * 10) / 10 : null, hist: attSnaps().map((_, i) => attMap(i).get(nk) ?? null) };
}
const attCls = (p) => (p == null ? '' : p < WB.settings.attMin ? 'attlow' : p < 95 ? 'attmid' : '');
const attTxt = (p) => (p == null ? '<span class="muted">–</span>' : `<span class="att ${attCls(p)}">${p.toFixed(1)}%</span>`);
function remember() {
  try {
    if (WB?.settings.remember) localStorage.setItem('y12-workbook', JSON.stringify(WB));
    else localStorage.removeItem('y12-workbook');
  } catch { toast('Could not save in this browser. Use Save workbook instead.'); }
}
function changed() { DIRTY = !WB.settings.remember; remember(); }
function fixWorkbook(d) { d.settings = { ...DEFAULT_SETTINGS, ...d.settings }; d.drops ||= []; d.att ||= []; return d; }
window.addEventListener('beforeunload', (e) => { if (DIRTY && WB?.drops.length) { e.preventDefault(); e.returnValue = ''; } });

// =====================================================================
//  Analysis for one data drop
// =====================================================================
function analyse(di) {
  const drop = WB.drops[di]; if (!drop) return null;
  const prev = di > 0 ? WB.drops[di - 1] : null;
  const S = WB.settings;
  // BTEC detection per subject, using all values across drops
  const vals = {};
  for (const d of WB.drops) for (const r of d.records) (vals[r.subj] ||= []).push(r.wag, r.tgt);
  const btec = {}; for (const s in vals) btec[s] = isBtecSubject(s, vals[s].filter(Boolean));
  const prevMap = {};
  if (prev) for (const r of prev.records) prevMap[r.sid + '|' + r.subj] = r;
  const students = {};
  for (const r of drop.records) {
    const st = (students[r.sid] ||= { sid: r.sid, name: r.name, sort: r.sort || r.name, form: r.form, subs: [] });
    const w = gradeValue(r.wag, btec[r.subj]), t = gradeValue(r.tgt, btec[r.subj]);
    const p = prevMap[r.sid + '|' + r.subj];
    const res = w != null && t != null ? Math.round((w - t) * 100) / 100 : null;
    const sub = { ...r, w, t, res, prev: p || null, ind: IND.map((k) => r[k]) };
    sub.indAvg = avg(IND.map((k) => IND_VAL[r[k]]));
    sub.prevAvg = p ? avg(IND.map((k) => IND_VAL[p[k]])) : null;
    sub.falls = p ? IND.filter((k) => IND_VAL[r[k]] && IND_VAL[p[k]] && IND_VAL[r[k]] < IND_VAL[p[k]]) : [];
    sub.rises = p ? IND.filter((k) => IND_VAL[r[k]] && IND_VAL[p[k]] && IND_VAL[r[k]] > IND_VAL[p[k]]) : [];
    const pw = p ? gradeValue(p.wag, btec[r.subj]) : null;
    sub.wagDrop = w != null && pw != null && w <= pw - 1;
    sub.wagRise = w != null && pw != null && w >= pw + 1;
    st.subs.push(sub);
  }
  for (const st of Object.values(students)) {
    st.subs.sort((a, b) => a.subj.localeCompare(b.subj));
    const bes = []; const below = []; const far = []; const falls = []; const wagDrops = [];
    for (const s of st.subs) {
      IND.forEach((k) => { if (s[k] === 'BE') bes.push(`${s.subj} ${IND_SHORT[k]}`); });
      if (s.res != null && s.res <= -1) below.push(s);
      if (s.res != null && s.res <= -S.farBelow) far.push(s);
      s.falls.forEach((k) => falls.push(`${s.subj} ${IND_SHORT[k]} ${s.prev[k]}→${s[k]}`));
      if (s.wagDrop) wagDrops.push(`${s.subj} ${s.prev.wag}→${s.wag}`);
    }
    const reasons = [];
    if (bes.length >= S.beMin) reasons.push({ t: `${bes.length} BE grades`, d: bes.join(', '), cls: '' });
    if (below.length >= S.belowMin) reasons.push({ t: `Below target in ${below.length} subjects`, d: below.map((s) => `${s.subj} ${s.wag} v ${s.tgt}`).join(', '), cls: '' });
    else if (far.length) reasons.push({ t: `${S.farBelow}+ grades below target`, d: far.map((s) => `${s.subj} ${s.wag} v ${s.tgt}`).join(', '), cls: '' });
    if (falls.length >= S.dropMin) reasons.push({ t: `${falls.length} indicators down`, d: falls.join(', '), cls: 'dec' });
    if (wagDrops.length >= S.wagDropMin) reasons.push({ t: `Working grade down in ${wagDrops.length} subjects`, d: wagDrops.join(', '), cls: 'dec' });
    st.nk = nkey(st.name, st.form);
    st.att = attInfo(st.nk);
    if (st.att && st.att.pct < S.attMin) reasons.push({ t: `Attendance ${st.att.pct.toFixed(1)}%`, d: `Below ${S.attMin}% (${attSnaps().at(-1).name})`, cls: 'att' });
    else if (st.att && st.att.change != null && st.att.change <= -S.attDrop) reasons.push({ t: `Attendance down ${Math.abs(st.att.change)} pts`, d: `${st.att.prev.toFixed(1)}% → ${st.att.pct.toFixed(1)}%`, cls: 'att' });
    st.bes = bes.length; st.below = below.length; st.falls = falls.length;
    st.reasons = reasons;
    st.score = bes.length * 2 + below.length * 2 + far.length * 2 + falls.length + wagDrops.length + (st.att && st.att.pct < S.attMin ? 4 + Math.round((S.attMin - st.att.pct) / 2) : 0) + (st.att && st.att.change != null && st.att.change <= -S.attDrop ? 2 : 0);
    st.indAvg = avg(st.subs.map((s) => s.indAvg));
    st.prevAvg = avg(st.subs.map((s) => s.prevAvg));
    st.change = st.indAvg != null && st.prevAvg != null ? st.indAvg - st.prevAvg : null;
    st.allEx = st.subs.length && st.subs.every((s) => IND.every((k) => s[k] === 'EX'));
    st.resAvg = avg(st.subs.map((s) => s.res));
  }
  const list = Object.values(students).sort((a, b) => a.sort.localeCompare(b.sort));
  const hasGrades = drop.records.some((r) => r.wag || r.tgt);
  return { drop, prev, students, list, btec, hasGrades };
}
function counts(records) {
  const c = { EX: 0, GD: 0, BE: 0, n: 0, on: 0, withT: 0 };
  for (const r of records) {
    for (const k of IND) if (r[k]) { c[r[k]]++; c.n++; }
    if (r.res != null) { c.withT++; if (r.res >= 0) c.on++; }
  }
  return c;
}
const allSubs = (A) => A.list.flatMap((s) => s.subs);
function stackBar(c) {
  const n = c.EX + c.GD + c.BE || 1;
  return `<div class="stack" title="EX ${pc(c.EX, n)}%, GD ${pc(c.GD, n)}%, BE ${pc(c.BE, n)}%"><div class="EX" style="width:${(100 * c.EX) / n}%"></div><div class="GD" style="width:${(100 * c.GD) / n}%"></div><div class="BE" style="width:${(100 * c.BE) / n}%"></div></div>`;
}
function resTxt(r) {
  if (r == null) return '<span class="res z">–</span>';
  const v = Math.round(r * 10) / 10;
  return `<span class="res ${v > 0 ? 'pos' : v < 0 ? 'neg' : 'z'}">${v > 0 ? '+' : ''}${v}</span>`;
}
function delta(now, before, unit = '%', invert = false) {
  if (before == null || now == null) return '';
  const d = Math.round((now - before) * 10) / 10;
  if (!d) return `<span class="muted">no change since ${esc(WB.drops[CUR - 1].name)}</span>`;
  const good = invert ? d < 0 : d > 0;
  return `<span class="${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit}</span> <span class="muted">since ${esc(WB.drops[CUR - 1].name)}</span>`;
}
const tutor = (f) => WB.settings.forms[f] || '';
const printHead = (title, sub) => `<div class="printhead"><h1>${esc(title)}</h1><div>${esc(sub ?? (WB.drops[CUR]?.name || ''))} · printed ${new Date().toLocaleDateString('en-GB')}</div></div>`;

// ---------- subjects ----------
function vSubjects(A) {
  const P = A.prev ? analyse(CUR - 1) : null;
  const bySub = {};
  for (const s of allSubs(A)) (bySub[s.subj] ||= []).push(s);
  const pBy = {}; if (P) for (const s of allSubs(P)) (pBy[s.subj] ||= []).push(s);
  const names = Object.keys(bySub).sort();
  if (UI.subject && !bySub[UI.subject]) UI.subject = null;
  if (!UI.subject) {
    $('#view').innerHTML = `${printHead('Subject overview')}
      <div class="toolbar"><span class="muted">Click a subject for its student list.</span><span style="flex:1"></span><button class="btn g" onclick="window.print()">Print</button></div>
      <div class="panel"><div class="scrollx"><table class="t"><tr><th>Subject</th><th class="n">Students</th><th>ATL</th><th>RtF</th><th>QoW</th><th class="n">BE</th>${A.hasGrades ? '<th class="n">On/above target</th><th class="n">Avg vs target</th>' : ''}${P ? '<th class="n">BE change</th>' : ''}</tr>
      ${names.map((n) => {
        const L = bySub[n], c = counts(L);
        const per = (k) => { const cc = { EX: 0, GD: 0, BE: 0 }; L.forEach((s) => s[k] && cc[s[k]]++); return stackBar(cc); };

function spark(vals, w = 90, h = 22) {
  const pts = vals.map((v, i) => [v, i]).filter(([v]) => v != null);
  if (pts.length < 2) return '';
  const x = (i) => 4 + (i * (w - 8)) / Math.max(1, vals.length - 1), y = (v) => h - 3 - ((v - 1) / 2) * (h - 6);
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><polyline fill="none" stroke="var(--green)" stroke-width="2" points="${pts.map(([v, i]) => `${x(i)},${y(v)}`).join(' ')}"/>${pts.map(([v, i]) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--green)"/>`).join('')}</svg>`;
}
function sparkPct(vals, w = 110, h = 24) {
  const pts = vals.map((v, i) => [v, i]).filter(([v]) => v != null);
  if (pts.length < 2) return '';
  const lo = Math.min(80, ...pts.map(([v]) => v)), x = (i) => 4 + (i * (w - 8)) / Math.max(1, vals.length - 1), y = (v) => h - 3 - ((v - lo) / (100 - lo || 1)) * (h - 6);
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(WB.settings.attMin)}" y2="${y(WB.settings.attMin)}" stroke="var(--be)" stroke-dasharray="3 3" stroke-width="1"/><polyline fill="none" stroke="var(--slate)" stroke-width="2" points="${pts.map(([v, i]) => `${x(i)},${y(v)}`).join(' ')}"/>${pts.map(([v, i]) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--slate)"/>`).join('')}</svg>`;
}

function downloadCsv(name, rows) {

function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

const RX = {
  id: /^(upn|adno|adm(ission)?\.?\s*(no|number)?|student id|mis id|pupil id|id)$/i,
  name: /^(name|student|student name|pupil|pupil name|full name|legal name|preferred name|learner)$/i,
  surname: /surname|last name|family name|legal surname/i,
  forename: /forename|first name|given name|preferred first/i,
  form: /^(reg|reg\.? group|registration|registration group|reg group|form|form group|tutor group|tg|class|house group)$/i,
  subject: /^(subject|course|subject name|qualification)$/i,
};
const MEASURES = [
  ['atl', /\b(atl|a\.t\.l|attitude( to learning)?)\b/i],
  ['rtf', /\b(rtf|response to feedback|feedback|response)\b/i],
  ['qow', /\b(qow|quality of work|quality)\b/i],
  ['tgt', /\b(target( grade)?|meg|mtg|minimum expected( grade)?|aspirational)\b/i],
  ['wag', /\b(working at( grade)?|wag|cwg|current( working)?( grade)?|predicted( grade)?|forecast( grade)?|attainment|grade)\b/i],
];
const MEASURE_NAME = { atl: 'Attitude to Learning', rtf: 'Response to Feedback', qow: 'Quality of Work', wag: 'Working at grade', tgt: 'Target grade', '': '(ignore)' };
function measureOf(h) { for (const [k, re] of MEASURES) if (re.test(h)) return k; return ''; }
function subjectOf(h) {
  let s = h;
  for (const [, re] of MEASURES) s = s.replace(re, ' ');
  s = s.replace(/\b(a[\s-]?level|as[\s-]?level|yr\s?12|year\s?12|y12|12\b)/ig, ' ').replace(/[\[\]()]/g, ' ').replace(/[-:|_\/,.]+/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}

async function readFile(file) {
  const buf = await file.arrayBuffer();
  let wb;
  try { wb = XLSX.read(buf, { type: 'array', raw: false, cellDates: true }); }
  catch (e) { return toast('Could not read that file'); }
  IMP.file = file.name; IMP.wb = wb; IMP.sheet = wb.SheetNames[0];
  IMP.dropName = IMP.kind === 'att' ? `Attendance ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
  prepareSheet();
}
function prepareSheet() {
  const rows = XLSX.utils.sheet_to_json(IMP.wb.Sheets[IMP.sheet], { header: 1, defval: '', raw: false, blankrows: false });
  // find the header row
  let hi = 0;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = rows[i].map((c) => String(c).trim());

function studentName(get, m) {
  if (m.surname >= 0 && m.forename >= 0) return [`${get(m.forename)} ${get(m.surname)}`.trim(), `${get(m.surname)} ${get(m.forename)}`];
  const raw = get(m.name >= 0 ? m.name : m.surname);
  if (raw.includes(',')) { const [sn, fn] = raw.split(',').map((x) => x.trim()); return [`${fn} ${sn}`.trim(), `${sn} ${fn}`]; }
  const p = raw.split(' '); return [raw, p.length > 1 ? p.slice(-1)[0] + ' ' + p.slice(0, -1).join(' ') : raw];
}
function buildAtt() {
  const m = IMP.map;
  if (m.name < 0 && m.surname < 0) return { error: 'Choose the column with student names (or surname and forename).' };
  if (m.form < 0) return { error: 'Choose the tutor group column.' };
  if (m.att < 0) return { error: 'Choose the attendance column.' };
  const recs = []; let skipped = 0;
  for (const r of IMP.rows) {
    const get = (i) => (i >= 0 ? String(r[i] ?? '').trim() : '');
    const [name, sort] = studentName(get, m);
    const pct = parsePct(get(m.att));
    if (!name || pct == null) { skipped++; continue; }
    const form = normForm(get(m.form));
    recs.push({ nk: nkey(name, form), name, sort, form, pct });
  }
  if (!recs.length) return { error: 'No attendance figures were found with these settings.' };
  // Figures given as fractions (0.93) rather than percentages
  if (recs.every((r) => r.pct <= 1)) recs.forEach((r) => (r.pct = r.pct * 100));
  recs.forEach((r) => (r.pct = Math.round(r.pct * 10) / 10));
  return { records: recs, skipped };
}

      ${matched != null ? `<div class="${matched < records.length ? 'warn' : 'ok'}"><b>${matched}</b> of ${records.length} matched to students in the grades data.${matched < records.length ? ' The others will still appear on the Attendance page, listed as not matched.' : ''}</div>` : ''}

function normForm(f) { const s = String(f ?? '').trim().toUpperCase(); const m = s.match(/\b(1[23])\s*([A-Z])\b/); return m ? m[1] + m[2] : s; }
function buildRecords() {
  const m = IMP.map, H = IMP.rows;
  if (m.name < 0 && m.surname < 0) return { error: 'Choose the column with student names (or surname and forename).' };
  if (m.form < 0) return { error: 'Choose the tutor group column.' };
  const cols = IMP.cols.filter((c) => c.m && (IMP.long || c.subj));
  if (!cols.length) return { error: 'No measure columns are matched yet.' };
  if (IMP.long && m.subject < 0) return { error: 'Choose the subject column.' };
  const records = [];
  let skipped = 0;
  for (const r of H) {
    const get = (i) => (i >= 0 ? String(r[i] ?? '').trim() : '');
    let name, sort;
    if (m.surname >= 0 && m.forename >= 0) { name = `${get(m.forename)} ${get(m.surname)}`.trim(); sort = `${get(m.surname)} ${get(m.forename)}`; }
    else {
      const raw = get(m.name >= 0 ? m.name : m.surname);
      if (raw.includes(',')) { const [sn, fn] = raw.split(',').map((x) => x.trim()); name = `${fn} ${sn}`.trim(); sort = `${sn} ${fn}`; }
      else { name = raw; const p = raw.split(' '); sort = p.length > 1 ? p.slice(-1)[0] + ' ' + p.slice(0, -1).join(' ') : raw; }
    }
    if (!name) { skipped++; continue; }
    const form = normForm(get(m.form));
    const sid = (get(m.id) || `${name}|${form}`).toLowerCase();
    const groups = {};
    for (const c of cols) {
      const subj = IMP.long ? get(m.subject) : c.subj;
      if (!subj) continue;
      const v = get(c.i);
      const g = (groups[subj] ||= { atl: '', rtf: '', qow: '', wag: '', tgt: '' });
      if (IND.includes(c.m)) g[c.m] = indicator(v) || g[c.m]; else if (v) g[c.m] = v.toUpperCase().replace(/\s+/g, '');
    }
    for (const [subj, g] of Object.entries(groups)) {
      if (!g.atl && !g.rtf && !g.qow && !g.wag) continue;
      records.push({ sid, name, sort, form, subj, ...g });
    }
  }
  if (!records.length) return { error: 'No student grades were found with these settings.' };
  return { records, skipped };
}
function stepCheck({ records, skipped }) {
  const students = new Set(records.map((r) => r.sid)).size;

  const inds = records.flatMap((r) => IND.map((k) => r[k])).filter(Boolean).length;
  const odd = records.filter((r) => IND.some((k) => r[k] === '') && (r.atl || r.rtf || r.qow)).length;
  const known = WB?.drops.length ? new Set(WB.drops.flatMap((d) => d.records.map((r) => r.subj))) : null;

      ${odd ? `<div class="warn">${odd} subject entries have some indicators missing. They'll show as “–”.</div>` : ''}
      ${skipped ? `<div class="warn">${skipped} rows had no student name and were skipped.</div>` : ''}
      ${newSubs.length ? `<div class="warn">These subject names aren't in your earlier data drops, so they'll be treated as new subjects: <b>${newSubs.map(esc).join(', ')}</b>. If one is a different spelling of an existing subject, go back and rename it.</div>` : ''}
      <p class="note">Subjects: ${subjects.map(esc).join(', ')}</p>

    </div>
    <div class="mf"><button class="btn" id="cBack">← Back</button><button class="btn g" id="cAdd">Add data drop</button></div>`;
  $$('[data-close]', box).forEach((b) => b.onclick = closeModal);
  $('#cBack').onclick = stepMap;
  $('#cAdd').onclick = () => {

    addDrop(name, records); closeModal(); toast(`Added ${name}`);
  };
}

async function loadSample() {
  try {
    WB = newWorkbook();
    for (const [file, name] of [['samples/sample-settling-in-review-wide.csv', 'Settling-in review (Oct)'], ['samples/sample-assessment-report-1-long.csv', 'Assessment Report 1 (Dec)']]) {
      const buf = await fetch(file).then((r) => { if (!r.ok) throw new Error(); return r.arrayBuffer(); });
      IMP = { file, wb: XLSX.read(buf, { type: 'array', raw: false }), dropName: name };
      IMP.sheet = IMP.wb.SheetNames[0];
      prepareSheetSilent();
      const res = buildRecords(); if (res.error) throw new Error(res.error);
      WB.drops.push({ id: Math.random(), name, added: new Date().toISOString(), records: res.records });
    }
    for (const [file, name] of [['samples/sample-attendance-october.csv', 'Attendance to 23 Oct'], ['samples/sample-attendance-december.csv', 'Attendance to 11 Dec']]) {
      const buf = await fetch(file).then((r) => { if (!r.ok) throw new Error(); return r.arrayBuffer(); });
      IMP = { kind: 'att', file, wb: XLSX.read(buf, { type: 'array', raw: false }), dropName: name };
      IMP.sheet = IMP.wb.SheetNames[0];
      const real = stepMapAtt; stepMapAtt = () => {}; try { prepareSheet(); } finally { stepMapAtt = real; }
      const res = buildAtt(); if (res.error) throw new Error(res.error);
      WB.att.push({ id: Math.random(), name, added: new Date().toISOString(), records: res.records });
    }
    closeModal(); CUR = WB.drops.length - 1; DIRTY = false; render(); toast('Sample data loaded (made-up students)');
  } catch (e) { WB = null; render(); toast('Could not load the sample files'); }
}

  $$('[data-adel]').forEach((b) => b.onclick = () => { if (confirm(`Remove "${WB.att[+b.dataset.adel].name}"?`)) { WB.att.splice(+b.dataset.adel, 1); changed(); closeModal(); render(); } });
  $$('[data-del]').forEach((b) => b.onclick = () => { if (confirm(`Remove "${WB.drops[+b.dataset.del].name}"?`)) { WB.drops.splice(+b.dataset.del, 1); CUR = null; changed(); closeModal(); render(); } });
  $$('[data-up]').forEach((b) => b.onclick = () => { const i = +b.dataset.up; [WB.drops[i - 1], WB.drops[i]] = [WB.drops[i], WB.drops[i - 1]]; changed(); closeModal(); $('#setBtn').click(); render(); });
  $('#sClear').onclick = () => { if (confirm('Remove all data drops from this page? Save the workbook first if you want to keep them.')) { WB = null; DIRTY = false; try { localStorage.removeItem('y12-workbook'); } catch {} closeModal(); render(); } };
  $('#sSave').onclick = () => {
    S.beMin = +$('#sBe').value || 2; S.belowMin = +$('#sBelow').value || 2; S.farBelow = +$('#sFar').value || 2; S.dropMin = +$('#sDrop').value || 2; S.wagDropMin = +$('#sWag').value || 2; S.attMin = +$('#sAtt').value || 90; S.attDrop = +$('#sAttDrop').value || 3;
    $$('[data-an]').forEach((el) => { WB.att[+el.dataset.an].name = el.value.trim() || WB.att[+el.dataset.an].name; });
    S.forms = Object.fromEntries($('#sForms').value.split('\n').map((l) => l.split('=').map((x) => x.trim())).filter((p) => p[0]).map(([f, t]) => [normForm(f), t || '']));
    $$('[data-dn]').forEach((el) => { WB.drops[+el.dataset.dn].name = el.value.trim() || WB.drops[+el.dataset.dn].name; });
    S.remember = $('#sRem').checked;
    changed(); closeModal(); render(); toast('Settings saved');
  };
};

// ---------- start ----------
try { const s = localStorage.getItem('y12-workbook'); if (s) WB = fixWorkbook(JSON.parse(s)); } catch {}
render();
</script>
</body>
</html>
